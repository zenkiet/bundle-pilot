<rect x="60" y="392" width="210" height="64" rx="12" fill="#ffffff" stroke="#e3e0d8"/>
<text x="165" y="418" text-anchor="middle" font-size="14" fill="#4b5b66">each visit sends a few facts</text>
<text x="165" y="440" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f2a3a">backend · store · user</text>
