<text x="812" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#0f2a3a">everyone else</text>
<g transform="translate(930 80)"><rect x="0" y="0" width="112" height="84" rx="14" fill="#d9a066" stroke="#f5b400" stroke-width="6"/><rect x="44.0" y="3" width="24" height="78" fill="#b87333"/><rect x="14" y="16" width="34" height="18" rx="3" fill="#ffffff"/><text x="56.0" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a3a">4.80.0</text><text x="56.0" y="142" text-anchor="middle" font-size="16" fill="#4b5b66">new build, a few stores</text></g>
<g transform="translate(930 284)"><rect x="0" y="0" width="112" height="84" rx="14" fill="#d9a066" stroke="#0f2a3a" stroke-width="6"/><rect x="44.0" y="3" width="24" height="78" fill="#b87333"/><rect x="14" y="16" width="34" height="18" rx="3" fill="#ffffff"/><text x="56.0" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#0f2a3a">4.78.0</text><text x="56.0" y="142" text-anchor="middle" font-size="16" fill="#4b5b66">stable, most users</text></g>
<text x="1086" y="140" font-size="15" fill="#4b5b66">widen the</text><text x="1086" y="160" font-size="15" fill="#4b5b66">group over</text><text x="1086" y="180" font-size="15" fill="#4b5b66">days, not all</text><text x="1086" y="200" font-size="15" fill="#4b5b66">at once</text>
