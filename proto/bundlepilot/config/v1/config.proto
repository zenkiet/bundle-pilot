syntax = "proto3";

package bundlepilot.config.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/zenkiet/bundle-pilot/internal/gen/configv1;configv1";

// Config is config.pb: rules are checked top to bottom, then the backend table, then the default.
message Config {
  string schema = 1 [json_name = "$schema"];
  Source source = 2;
  // MM.dd.YYYY by default.
  string date_format = 3;
  // For visitors without a cookie and when nothing matches.
  string default_bundle = 4 [json_name = "default"];
  // "<oldest backend>": "<bundle>".
  map<string, string> backend = 5;
  repeated Rule rules = 6;
  Auth auth = 7;
  string project_name = 8;
  // A label such as production.
  string environment = 9;
  // Set by SetBlocked; every config save keeps them.
  repeated string blocked = 10;
  // Set by CreateToken and DeleteToken; every config save keeps them.
  repeated Token tokens = 11;
}

message Token {
  string name = 1;
  // read, upload or admin.
  string scope = 2;
  // Of the secret, hex; the secret is shown once.
  string sha256 = 3;
  // RFC 3339.
  string created = 4;
  // RFC 3339; empty: never.
  string expires = 5;
}

// Revision is one saved config in DIST/history, secrets masked.
message Revision {
  string by = 1;
  // The Config, encoded.
  bytes config = 2;
  string note = 3;
}

message Auth {
  string username = 1;
  // Masked as *** when read back.
  string password_hash = 2;
  // Write-only: hashed into password_hash before saving.
  string password = 3;
}

// Source is where versions/*.zip come from; unset means the local directory.
message Source {
  // "local" or "s3".
  string type = 1;
  string bucket = 2;
  // Such as prod/.
  string prefix = 3;
  // Empty for AWS; https://<ACCOUNT_ID>.r2.cloudflarestorage.com for R2.
  string endpoint = 4;
  // auto for R2.
  string region = 5;
  // Leave both keys empty for the AWS credential chain.
  string access_key_id = 6;
  string secret_access_key = 7;
  // A Go duration, 30s by default.
  string poll = 8;
}

message Rule {
  string id = 1;
  // For operators; the gateway ignores it.
  string note = 2;
  // {"fact": value}, every entry must match. A value is a string, number, boolean or a list of
  // them; "*", "N%" and <, <=, >, >= comparisons are matchers.
  google.protobuf.Struct when = 3;
  string bundle = 4;
  // YYYY-MM-DD (through that UTC day) or an RFC 3339 time.
  string until = 5;
}
